<svg xmlns="http://www.w3.org/2000/svg" width="760" height="646" viewBox="0 0 760 646">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#555"/>
    </marker>
    <style>
      text { font-family: 'Times New Roman','Noto Serif CJK SC',serif; fill: #000; font-size: 20px; }
      .head { font-family: 'Noto Sans CJK SC',sans-serif; font-weight: bold; font-size: 22px; }
      .code { font-family: 'Times New Roman',serif; font-size: 21px; }
      .small { font-size: 18px; }
      .box { fill: #fafafa; stroke: #888; stroke-width: 1.2; }
      .link { fill: none; stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="20" y="12" width="720" height="126" rx="4"/>
  <text class="head" x="40" y="44">结构展开与单自旋串去重</text>
  <line x1="380" y1="56" x2="380" y2="123" stroke="#bbb"/>
  <text x="48" y="82">左结构 Φ<tspan baseline-shift="sub" font-size="14">I</tspan> → D₁, D₂, …</text>
  <text class="small" x="48" y="115">每项记录 α 串、β 串及展开系数</text>
  <text x="405" y="82">右结构 Φ<tspan baseline-shift="sub" font-size="14">J</tspan> → D₁, D₂, …</text>
  <text class="small" x="405" y="115">相同的单自旋占据串共用索引</text>
  <path class="link" d="M380 138V165"/>

  <rect class="box" x="20" y="172" width="720" height="128" rx="4"/>
  <text class="head" x="40" y="204">① 计算共享的单自旋串对核</text>
  <text class="code" x="637" y="204">Hamhd</text>
  <rect x="40" y="220" width="329" height="58" fill="#eee"/>
  <rect x="391" y="220" width="329" height="58" fill="#eee"/>
  <text x="56" y="244">α 串对 (a, a′)</text>
  <text class="small" x="56" y="269">重叠、同自旋能量、跃迁密度</text>
  <text x="407" y="244">β 串对 (b, b′)</text>
  <text class="small" x="407" y="269">重叠、同自旋能量、跃迁密度</text>
  <path class="link" d="M380 300V327"/>

  <rect class="box" x="20" y="334" width="720" height="128" rx="4"/>
  <text class="head" x="40" y="366">② 组合完整行列式对的 H/S 标量</text>
  <text class="code" x="656" y="366">Hov1</text>
  <text x="48" y="404">D<tspan baseline-shift="sub" font-size="14">μ</tspan> = (a, b)　与　D<tspan baseline-shift="sub" font-size="14">ν</tspan> = (a′, b′)</text>
  <path class="link" d="M477 398H545"/>
  <text x="565" y="404">H<tspan baseline-shift="sub" font-size="14">μν</tspan> , S<tspan baseline-shift="sub" font-size="14">μν</tspan></text>
  <text class="small" x="48" y="441">从 α、β 核组合重叠、同自旋及 opposite-spin 贡献</text>
  <path class="link" d="M380 462V489"/>

  <rect class="box" x="20" y="496" width="720" height="136" rx="4"/>
  <text class="head" x="40" y="528">③ 按结构归属和展开系数累加</text>
  <text class="code" x="625" y="528">Hovstr1</text>
  <text x="48" y="566">μ 所属结构列表 × ν 所属结构列表</text>
  <path class="link" d="M477 560H545"/>
  <text x="565" y="566">H<tspan baseline-shift="sub" font-size="14">IJ</tspan> , S<tspan baseline-shift="sub" font-size="14">IJ</tspan></text>
  <text class="small" x="48" y="607">同一项对可向多个结构对贡献；每次乘对应的展开系数</text>
</svg>
